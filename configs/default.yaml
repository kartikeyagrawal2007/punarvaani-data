# Default thresholds for the Punarvaani data engine. Copy this file and pass --config to change them.
# Clip rules follow the as-built trainer (docs/ARCHITECTURE.md, main repo): all frames read, 1.5-3 s clips,
# Devanagari only, CTC limit U+R <= ceil(frames/2)*4 per clip.
clip:
  min_s: 1.5
  max_s: 3.0
  min_words: 2
  max_words: 10
  pad_s: 0.08
  max_gap_s: 0.35
  ctc_steps: 0                 # 0 = per clip like the trainer; 32 = old fixed 16-frame rule
  fps: 25
text:
  spell_out_numbers: true
  reject_latin: true
  min_asr_word_prob: 0.45
face:
  sample_every: 2
  min_detect_ratio: 0.95
  max_faces: 1
  max_yaw_deg: 20.0
  max_pitch_deg: 20.0
  min_face_height_frac: 0.18
  min_mouth_px: 40
sync:
  enabled: true
  max_lag_frames: 5            # cheap pre-filter: mouth opening vs loudness
  min_corr: 0.15
  max_abs_offset_frames: 3
  method: syncnet              # syncnet | corr. SyncNet asks "is the face on screen the voice we hear?"
  syncnet_weights: ""          # empty = ~/.cache/pvdata/syncnet_v2.model (downloaded on first use)
  device: auto
  min_conf: 3.0                # talking heads ~5-10; voice-over, B-roll, dubbing ~0-2 (3-4 checked by eye: fine)
  max_syncnet_offset: 4        # frames at 25 fps
  context_s: 1.0               # also score up to 1 s of the same shot around the clip
  min_source_checked: 8        # per video: if fewer than half of its clips pass the sync checks,
  min_source_pass_rate: 0.5    # it is a news package / B-roll, and all its clips are dropped
shot:
  enabled: true                # a clip must be one camera shot (no cut to B-roll inside it)
  min_score: 15.0
  ratio: 3.0
  same_face_iou: 0.5           # and the face must jump (move, resize or vanish) at the cut
video:
  min_height: 720
  out_height: 720
  out_fps: 0                   # 0 = keep 24-30 fps sources, halve 48-60 (no stutter)
  keep_audio: true
asr:
  backend: faster-whisper
  model: large-v3
  language: hi
  device: auto
  compute_type: auto
val_frac: 0.1
test_frac: 0.1
seed: 0
# --- `pvdata auto` (discover -> screen -> mine) and `pvdata identify` -----------------------------------
screen:
  samples: 3                 # 3 x 20 s pieces at 360p decide whether a video is worth downloading
  sample_s: 20.0
  height: 360
  fps: 2.0
  min_face_ratio: 0.5        # one frontal, big-enough face in >= half of the sampled frames
  min_hindi_prob: 0.6        # Whisper language ID (Hindi + Urdu)
  min_devanagari_ratio: 0.85 # mostly Hindi words, not English
  min_words_per_s: 1.0
auto:
  target_hours: 100.0
  min_minutes: 4.0
  max_minutes: 60.0
  search_pool: 50
  max_search_pool: 400
  max_videos_per_channel: 25 # speaker diversity
  max_hours_per_channel: 3.0
  expand_after_videos: 2
  expand_min_minutes_per_video: 1.0
  channel_list_size: 60
  keep_downloads: false      # delete each full video after mining it
identity:
  frames_per_clip: 3
  same_person: 0.40
